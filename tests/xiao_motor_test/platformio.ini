; Bench test project for the L298N motor driver on the XIAO ESP32-S3.
; Not part of the DUST-E build - see main/main.ino for wiring and behavior.
;
; Unlike tests/l298n_motor_test and tests/obstacle_avoid_test (Arduino UNO Q,
; no PlatformIO target available), the XIAO ESP32-S3 has a real target and
; this file actually builds:
;
;     pio run              build
;     pio run -t upload    flash
;     pio device monitor   watch the bring-up trace at 115200 baud
;
; src_dir points at main/ so the single-file sketch is found without an
; Arduino-style top-level .ino, matching this test's layout to
; tests/l298n_motor_test's.

[platformio]
src_dir = main

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags = -Wall
