; =============================================================================
;  DUST-E BODY - PlatformIO build for the Seeed XIAO ESP32-S3.
;
;  The sketch is also a valid Arduino IDE project (DustEBody.ino plus the src/
;  tree), so it can be flashed either way. src_dir points at the project root
;  so both tools see the same layout - the same arrangement DustEWeb uses.
;
;    pio run              build
;    pio run -t upload    flash
;    pio device monitor   watch the [hb] line and the telemetry
;
;  USB CDC On Boot is enabled: Serial is the native USB port, which is also the
;  brain link. The boot ROM's own log appears there too and the brain's line
;  reader skips it on purpose.
; =============================================================================
[platformio]
src_dir = .

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit NeoPixel@^1.12.0
    madhephaestus/ESP32Servo@^3.0.5

build_flags =
    -Wall
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

build_src_filter =
    +<*>
    -<.pio/>
